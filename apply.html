<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>简历投递</title>
<style>
  :root{ --brand:#2b6cee; --brand-d:#1f54c4; --bg:#f4f6fb; --card:#fff;
         --line:#e3e8f2; --text:#1f2937; --sub:#6b7280; --ok:#16a34a; --err:#dc2626; }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
       background:var(--bg);color:var(--text);line-height:1.6;padding:18px 14px 40px}
  .box{max-width:480px;margin:0 auto;background:var(--card);border:1px solid var(--line);
       border-radius:16px;padding:22px;box-shadow:0 2px 10px rgba(20,40,80,.06)}
  .co{color:var(--brand);font-weight:700;font-size:18px;text-align:center;margin:0 0 2px}
  h1{font-size:20px;text-align:center;margin:0 0 4px}
  .ref{background:#eef2fb;color:var(--brand-d);text-align:center;border-radius:10px;
       padding:10px;font-weight:600;margin:14px 0 18px}
  .ref b{color:var(--text)}
  label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  label .req{color:var(--err)}
  input[type=text],input[type=email],input[type=tel],textarea,input[type=file]{
       width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
       font-size:15px;font-family:inherit;outline:none;background:#fff}
  input:focus,textarea:focus{border-color:var(--brand)}
  input[type=file]{padding:9px}
  button{width:100%;margin-top:20px;background:var(--brand);color:#fff;border:none;
         border-radius:11px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  .tip{font-size:12px;color:var(--sub);margin-top:16px;text-align:center}
  .ok{margin-top:10px;background:#eafaf0;color:var(--ok);border:1px solid #bfe9cd;
      border-radius:12px;padding:18px;text-align:center;font-weight:600;line-height:1.8}
</style>
</head>
<body>
<div class="box">
  <p class="co" id="co"></p>
  <h1>📨 校招内推简历投递</h1>
  <!-- 推荐人信息已隐藏，但仍作为隐藏字段提交到 HR 邮箱 -->
  <div class="ref" style="display:none;">您的内推推荐人：<b id="refName">—</b></div>

  <form id="f" action="https://formsubmit.co/87e9cdbe54d0c84eb58faf9012bb7ac8" method="POST" enctype="multipart/form-data">
    <label>您的姓名 <span class="req">*</span></label>
    <input type="text" name="姓名" required placeholder="请输入您的姓名">

    <label>意向岗位 <span class="req">*</span></label>
    <select name="意向岗位" required id="jobSelect">
      <option value="">请选择岗位</option>
    </select>

    <label>您的邮箱 <span class="req">*</span> <span style="font-weight:400;color:var(--sub)">（用于 HR 回复联系）</span></label>
    <input type="email" name="邮箱" required placeholder="name@example.com" id="inputEmail">

    <label>手机号</label>
    <input type="tel" name="手机号" placeholder="选填">

    <label>简历附件 <span class="req">*</span> <span style="font-weight:400;color:var(--sub)">（PDF/Word，≤10MB）</span></label>
    <input type="file" name="简历附件" required accept=".pdf,.doc,.docx" id="inputResume">

    <label>备注</label>
    <textarea name="备注" rows="3" placeholder="选填，如意向岗位、城市等"></textarea>

    <!-- formsubmit 原生提交；_next 让提交成功后自动跳回本页显示成功提示 -->
    <input type="hidden" name="_subject" id="f_subject">
    <input type="hidden" name="_next" id="f_next">
    <input type="hidden" name="_replyto" id="f_replyto">
    <input type="hidden" name="推荐人" id="f_ref">
    <input type="hidden" name="公司" id="f_company">

    <button type="submit" id="submitBtn">提交简历</button>
  </form>
  <p class="tip">提交后简历会直接发送到 HR 邮箱，推荐人信息已自动带入。<br>若微信/QQ提示「将要访问 formsubmit.co」，请点击「继续访问」，提交成功后会自动返回本页。<br><span style="color:var(--err)">建议使用系统浏览器（Edge/Chrome/Safari）上传简历，微信内置浏览器可能无法携带附件。</span></p>
</div>

<script>
/* =========================================================================
   配置区：HR 只需改这里
   -------------------------------------------------------------------------
   投递直连 formsubmit.co 的「隐形邮箱别名」（Invisible Email）：
   - FORM_ENDPOINT 填 formsubmit 发给你的随机别名地址（形如
     https://formsubmit.co/xxxxxxxx），源码里只有别名、没有任何邮箱，
     候选人查看网页源代码或爬 GitHub 仓库都拿不到 HR 真实邮箱。
   - 由候选人浏览器直连提交（真实用户 IP），不会像服务端中继那样被
     formsubmit 按机房 IP 限流（429），真实投递更稳。
   - 首次使用需在 HR 邮箱点一次 formsubmit 的激活链接（详见 README）。
   注：推荐人姓名由二维码 ?ref= 决定，候选人看不到也改不了。
   ========================================================================= */
const CONFIG = {
  // ✅ 已启用 formsubmit「隐形别名」：源码里只有这串随机字符，没有任何邮箱。
  //    候选人查看网页源码 / 爬 GitHub 仓库都拿不到 HR 真实邮箱。
  //    该别名与域名 https://j-chen-j.github.io/ 绑定。
  FORM_ENDPOINT: 'https://formsubmit.co/87e9cdbe54d0c84eb58faf9012bb7ac8',
  // 岗位数据由 HR 在 hr-jobs.html（Edge 双击即用）直接写回本仓库 jobs.json。
  // 投递页每次打开实时拉取 jobs.json（带时间戳防缓存），HR 保存后约 1 分钟全局生效。
  // 表单字段 name 使用中文，formsubmit 邮件里会显示中文标签。
  JOBS: ['Java开发工程师', '前端开发工程师', '产品经理', '测试工程师'], // ← 拉取失败时的兜底
};

// 从链接读取推荐人与公司
const params = new URLSearchParams(location.search);
const refName = params.get('ref') || '未知';
const coName  = params.get('co') || '';
document.getElementById('refName').textContent = refName;
document.getElementById('co').textContent = coName ? (coName + ' · 校招内推') : '校招内推';

// 渲染岗位下拉框（实时拉取仓库 jobs.json，HR 在 hr-jobs.html 改完即写回；失败回退内联配置）
const jobSelect = document.getElementById('jobSelect');
async function loadJobs(){
  let list = CONFIG.JOBS;
  try {
    const r = await fetch('jobs.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) {
      const j = await r.json();
      if (Array.isArray(j.JOBS) && j.JOBS.length) list = j.JOBS;
    }
  } catch (e) { /* 网络失败时回退内联配置兜底 */ }
  if (Array.isArray(list) && list.length) {
    list.forEach(function(j){
      const opt = document.createElement('option');
      opt.value = j;
      opt.textContent = j;
      jobSelect.appendChild(opt);
    });
  } else {
    jobSelect.style.display = 'none';
    jobSelect.required = false;
  }
}
loadJobs();

// 预填隐藏字段（推荐人 / 公司 / 邮件主题 / 回跳地址 / 回复地址）
document.getElementById('f_ref').value = refName;
document.getElementById('f_company').value = coName;
document.getElementById('f_subject').value = '【校招内推】' + (coName ? coName + ' · ' : '') + '推荐人：' + refName;

// 提交后让 formsubmit 跳回本页，保留原 ref/co 参数并加上 ?success=1
const nextUrl = new URL(location.href);
nextUrl.searchParams.set('success', '1');
document.getElementById('f_next').value = nextUrl.toString();

// 附件大小校验：formsubmit 免费版要求单个提交总大小 ≤10MB
const resumeInput = document.getElementById('inputResume');
const emailInput = document.getElementById('inputEmail');
const formEl = document.getElementById('f');
formEl.addEventListener('submit', function(e){
  const file = resumeInput.files[0];
  if (file && file.size > 10 * 1024 * 1024) {
    alert('简历附件过大（超过 10MB），请压缩后重新上传。');
    e.preventDefault();
    return;
  }
  // 把候选人邮箱设为回复地址，方便 HR 一键回复
  document.getElementById('f_replyto').value = emailInput.value || '';
  document.getElementById('submitBtn').textContent = '提交中…';
  document.getElementById('submitBtn').disabled = true;
});

// formsubmit 回跳带 ?success=1，显示成功提示并隐藏表单
if (params.get('success') === '1') {
  document.getElementById('f').style.display = 'none';
  const ok = document.createElement('div');
  ok.className = 'ok';
  ok.innerHTML = '✅ 提交成功！<br>HR 会尽快查看您的简历，感谢您的投递。';
  document.querySelector('.box').appendChild(ok);
}
</script>
</body>
</html>
