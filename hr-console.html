<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>校招内推 · 岗位管理</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --primary:#2563eb; --primary-d:#1d4ed8; --danger:#dc2626; --muted:#6b7280; --line:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif; background:var(--bg); color:#111; }
  .wrap { max-width:720px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 22px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 18px; line-height:1.6; }
  label { display:block; font-size:14px; font-weight:600; margin:16px 0 6px; }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .row input[type=text] { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:9px; font-size:15px; }
  .row input[type=text]:focus { outline:none; border-color:var(--primary); }
  .row input[type=password] { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:9px; font-size:15px; }
  .row input[type=password]:focus { outline:none; border-color:var(--primary); }
  .btn { border:none; border-radius:9px; padding:9px 14px; font-size:14px; cursor:pointer; transition:.15s; white-space:nowrap; }
  .btn-add { background:var(--primary); color:#fff; }
  .btn-add:hover { background:var(--primary-d); }
  .btn-del { background:#fee2e2; color:var(--danger); }
  .btn-up, .btn-down { background:#eef2ff; color:var(--primary); padding:6px 10px; font-size:12px; }
  .actions { margin-top:18px; display:flex; gap:10px; align-items:center; }
  .btn-save { background:var(--primary); color:#fff; font-size:15px; padding:11px 22px; }
  .btn-save:hover { background:var(--primary-d); }
  .btn-save:disabled { opacity:.6; cursor:default; }
  .status { font-size:13px; margin-left:6px; }
  .ok { color:#16a34a; } .err { color:var(--danger); } .busy { color:var(--muted); }
  .hint { font-size:12px; color:var(--muted); line-height:1.6; margin-top:16px; border-top:1px dashed var(--line); padding-top:12px; }
  code { background:#f1f5f9; padding:1px 5px; border-radius:4px; font-size:12px; }
  .loading { color:var(--muted); font-size:14px; padding:10px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>校招内推 · 岗位管理</h1>
    <p class="sub">输入管理口令后，可逐条增删 / 调整岗位顺序。<br>保存后约 1 分钟，所有招聘二维码与投递页自动更新。</p>

    <label>管理口令</label>
    <div class="row">
      <input type="password" id="secret" placeholder="向系统管理员索取口令" autocomplete="off" />
    </div>

    <div id="list"></div>
    <div id="loading" class="loading">正在读取当前岗位列表…</div>
    <div class="row">
      <input id="newJob" type="text" placeholder="输入新岗位名，例如：数据分析师" />
      <button class="btn btn-add" onclick="addJob()">+ 添加</button>
    </div>
    <div class="actions">
      <button class="btn btn-save" id="saveBtn" onclick="saveJobs()">保存并生效</button>
      <span class="status" id="status"></span>
    </div>
    <div class="hint">
      <b>使用说明</b><br>
      1. 在「管理口令」处输入管理员提供的口令（无需 GitHub 令牌）；<br>
      2. 在上方逐条增删岗位、用 ↑↓ 调整顺序；<br>
      3. 点「保存并生效」即写入招聘系统，候选人刷新二维码即可看到；<br>
      4. 本页仅作岗位管理，<b>不含任何邮箱或令牌信息</b>；凭据由系统后端安全保管。
    </div>
  </div>
</div>

<script>
// ====== 配置区 ======
// 后端走 SCF 函数 URL：HR 只输口令，由后端用环境变量里的 GITHUB_TOKEN 写入 jobs.json。
const ENDPOINT = 'https://1475238472-ll5mcfx3ck.ap-shanghai.tencentscf.com';
const RAW = 'https://raw.githubusercontent.com/j-chen-j/campus-referral/main/jobs.json';
const BRANCH = "main";
// ====================

let jobs = [];

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function setStatus(msg, cls){ const s=document.getElementById('status'); s.textContent=msg; s.className='status '+(cls||''); }

function render() {
  document.getElementById('loading').style.display = 'none';
  const list = document.getElementById('list');
  list.innerHTML = '';
  jobs.forEach((job, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <input type="text" value="${escapeHtml(job)}" onchange="jobs[${i}]=this.value" />
      <button class="btn btn-up"   onclick="move(${i},-1)">↑</button>
      <button class="btn btn-down" onclick="move(${i},1)">↓</button>
      <button class="btn btn-del"  onclick="del(${i})">删除</button>`;
    list.appendChild(row);
  });
  document.getElementById('status').className = 'status';
  document.getElementById('status').textContent = `当前共 ${jobs.length} 个岗位`;
}

function addJob() {
  const inp = document.getElementById('newJob');
  const v = inp.value.trim();
  if (!v) return;
  jobs.push(v); inp.value = ''; render();
}
function del(i){ jobs.splice(i,1); render(); }
function move(i,d){ const j=i+d; if(j<0||j>=jobs.length) return; [jobs[i],jobs[j]]=[jobs[j],jobs[i]]; render(); }

// 打开页面时拉取当前岗位，方便在现有基础上修改（只读 raw 地址，免 token）
(async function loadJobs() {
  try {
    const res = await fetch(RAW + '?t=' + Date.now(), { cache:'no-store' });
    const data = await res.json();
    if (Array.isArray(data.JOBS)) { jobs = data.JOBS; render(); return; }
  } catch(e){ /* 读取失败不阻断，使用默认兜底 */ }
  jobs = ['Java开发工程师','前端开发工程师','产品经理','测试工程师'];
  render();
})();

async function saveJobs() {
  const secret = document.getElementById('secret').value.trim();
  if (!secret) { setStatus('请先输入管理口令', 'err'); document.getElementById('secret').focus(); return; }
  // 从当前输入框实时取值，不依赖 onchange 触发顺序
  const inputs = document.querySelectorAll('#list .row input[type=text]');
  const clean = Array.from(inputs).map(inp => inp.value.trim()).filter(Boolean);
  if (clean.length === 0) { setStatus('请至少保留一个岗位', 'err'); return; }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; setStatus('保存中…', 'busy');
  try {
    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret: secret, jobs: clean })
    });
    const data = await res.json();
    if (data && data.success) {
      setStatus('✅ ' + (data.message || '已保存，约 1 分钟后生效'), 'ok');
      jobs = clean; render();
    } else {
      setStatus('❌ 保存失败：' + (data && data.message ? data.message : '未知错误'), 'err');
    }
  } catch(e) {
    setStatus('❌ 网络错误：' + e.message, 'err');
  } finally { btn.disabled = false; }
}
</script>
</body>
</html>
