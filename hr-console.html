<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校招内推 · 岗位管理</title>
  <style>
    :root {
      --bg: #f8fafc; --card: #fff; --line: #e2e8f0; --text: #1e293b;
      --sub: #64748b; --brand: #2563eb; --brand-d: #1d4ed8;
      --ok: #16a34a; --err: #dc2626; --warn: #d97706;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex; justify-content: center; padding: 32px 16px;
    }
    .card {
      width: 100%; max-width: 560px; background: var(--card);
      border: 1px solid var(--line); border-radius: 16px; padding: 28px 26px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, .06);
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--sub); font-size: 13px; margin: 0 0 20px; line-height: 1.6; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
    .hint { font-weight: 400; color: var(--sub); font-size: 12px; }
    input[type=password], textarea {
      width: 100%; padding: 11px 12px; border: 1px solid var(--line);
      border-radius: 10px; font-size: 14px; font-family: inherit; color: var(--text);
      background: #fff;
    }
    textarea { min-height: 160px; resize: vertical; line-height: 1.7; }
    input:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    button {
      margin-top: 20px; width: 100%; padding: 13px; border: none; border-radius: 10px;
      background: var(--brand); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: var(--brand-d); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .msg { margin-top: 16px; font-size: 13px; padding: 10px 12px; border-radius: 8px; display: none; }
    .msg.ok { display: block; background: #f0fdf4; color: var(--ok); border: 1px solid #bbf7d0; }
    .msg.err { display: block; background: #fef2f2; color: var(--err); border: 1px solid #fecaca; }
    .msg.busy { display: block; background: #fffbeb; color: var(--warn); border: 1px solid #fde68a; }
    .tip { margin-top: 18px; font-size: 12px; color: var(--sub); line-height: 1.6; border-top: 1px dashed var(--line); padding-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>校招内推 · 岗位管理</h1>
    <p class="sub">输入口令后可增删 / 调整岗位顺序。<br>保存后约 1 分钟，所有招聘二维码与投递页自动更新。</p>

    <label>管理口令</label>
    <input type="password" id="secret" placeholder="向系统管理员索取口令" autocomplete="off">

    <label>岗位列表 <span class="hint">每行一个，顺序即下拉框从上到下</span></label>
    <textarea id="jobs" placeholder="后端开发工程师&#10;前端开发工程师&#10;算法工程师"></textarea>

    <button id="saveBtn">保存并更新</button>
    <div class="msg" id="msg"></div>

    <p class="tip">本页由系统统一托管，无需安装任何软件。岗位数据保存在招聘系统仓库，仅管理员可配置口令。</p>
  </div>

  <script>
    const ENDPOINT = 'https://1475238472-ll5mcfx3ck.ap-shanghai.tencentscf.com';
    const RAW = 'https://raw.githubusercontent.com/j-chen-j/campus-referral/main/jobs.json';

    const $secret = document.getElementById('secret');
    const $jobs   = document.getElementById('jobs');
    const $btn    = document.getElementById('saveBtn');
    const $msg    = document.getElementById('msg');

    function setMsg(text, type) {
      $msg.textContent = text;
      $msg.className = 'msg' + (type ? ' ' + type : '');
    }

    // 打开页面时拉取当前岗位，方便 HR 在现有基础上修改
    (async function load() {
      try {
        const res = await fetch(RAW + '?t=' + Date.now(), { cache: 'no-store' });
        const data = await res.json();
        if (Array.isArray(data.JOBS)) {
          $jobs.value = data.JOBS.join('\n');
        }
      } catch (e) {
        // 读取失败不阻断，HR 直接手动填写即可
      }
    })();

    $btn.addEventListener('click', async () => {
      const secret = $secret.value.trim();
      const jobs = $jobs.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      if (!secret) { setMsg('请先输入管理口令', 'err'); return; }
      if (!jobs.length) { setMsg('请至少填写一个岗位', 'err'); return; }

      $btn.disabled = true;
      setMsg('保存中…', 'busy');
      try {
        const res = await fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ secret: secret, jobs: jobs })
        });
        const data = await res.json();
        if (data && data.success) {
          setMsg(data.message || '岗位已更新', 'ok');
        } else {
          setMsg('保存失败：' + (data && data.message ? data.message : '未知错误'), 'err');
        }
      } catch (e) {
        setMsg('请求失败：' + e.message + '（请确认网络或稍后重试）', 'err');
      } finally {
        $btn.disabled = false;
      }
    });
  </script>
</body>
</html>
